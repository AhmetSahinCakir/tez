# B2 (advisor review, experiment 6): the triangle-wave map on the FINAL sequential CIFAR-100 binary streams
# (online variant, same streams and settings as suites/cifar_main.yaml). No CIFAR dev search for tri: gamma = 1.0
# (the PMNIST selection, equal to Weight Clipping's kappa = 1 bound) and gamma = 1.5 (the sin/tanh default), lr = 0.003
# (the lr selected for weight_clipping / sin on CIFAR).
name: cifar_tri
base_config: configs/cifar_pilot.yaml
workers: 4
stream_seed_offset: 0
seeds: [0, 1, 2, 3, 4]
common:
  stream.n_tasks: 1000
  metrics.every_n_tasks: 10
  metrics.fisher_samples: 32
  metrics.update_tracking_every: 100
  fresh_reference.every_n_tasks: 100
  optimizer.lr: 0.003
runs:
  - {label: tri, overrides: {model.reparam.hidden: tri, model.reparam.output: tri, model.gamma: 1.0}}
  - {label: tri_gamma1.5, overrides: {model.reparam.hidden: tri, model.reparam.output: tri, model.gamma: 1.5}}

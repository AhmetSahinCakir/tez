# Open question raised by the project report (§11): the proposed sin model is strongest under Adam, but the
# published methods were only run with SGD. Here the published methods are run under Adam (lr 1e-3, the
# setting where adam_std collapses and adam_sin retains plasticity) on the SAME final streams/seeds as
# pmnist_ablation's adam_* runs, plus the 'bound only the output layer + Continual Backprop' combination (SGD).
name: pmnist_adam_methods
base_config: configs/pmnist_pilot.yaml
workers: 4
stream_seed_offset: 0
selected_hparams: suites/selected_pmnist.yaml
seeds: [0, 1, 2]
common:
  stream.n_tasks: 200
  stream.samples_per_task: 5000
  metrics.every_n_tasks: 5
  metrics.fisher_samples: 32
  metrics.update_tracking_every: 100
  fresh_reference.every_n_tasks: 25
runs:
  - {label: adam_weight_clipping, overrides: {optimizer.name: adam, optimizer.lr: 0.001, method.name: weight_clipping, method.kappa: 1.0}}
  - {label: adam_l2_init, overrides: {optimizer.name: adam, optimizer.lr: 0.001, method.name: l2_init, method.lam: 0.01}}
  - {label: adam_continual_backprop, overrides: {optimizer.name: adam, optimizer.lr: 0.001, method.name: continual_backprop, method.replacement_rate: 0.0001}}
  - {label: adam_nap, overrides: {optimizer.name: adam, optimizer.lr: 0.001, method.name: nap, model.layer_norm: true, model.ln_affine: false}}
  - {label: adam_sin_cbp, overrides: {optimizer.name: adam, optimizer.lr: 0.001, model.reparam.hidden: sin, model.reparam.output: sin, method.name: continual_backprop, method.replacement_rate: 0.0001}}
  - {label: sin/output_only_cbp, overrides: {model.reparam.hidden: standard, model.reparam.output: sin, method.name: continual_backprop, method.replacement_rate: 0.0001}}
  - {label: adam_tri, overrides: {optimizer.name: adam, optimizer.lr: 0.001, model.reparam.hidden: tri, model.reparam.output: tri, model.gamma: 1.0}}

# Input standardization test (19 Nov 2026).  Open point of the journal draft: under the hard bounds (weight
# clipping, triangle wave) dead units concentrate in the first hidden layer, and with Adam the two methods
# collapse; inputs in [0, 1] were suspected.  Here the same runs are repeated with standardized inputs
# (stream.normalize: standard); everything else as in suites/pmnist_adam10.yaml (Adam, lr 1e-3) and
# suites/pmnist_main.yaml (SGD, lr 0.003).  No re-tuning: this is a transfer test, seeds 0-4 paired with the
# unit-input runs of the same seeds.
name: pmnist_inputnorm
base_config: configs/pmnist_pilot.yaml
workers: 4
stream_seed_offset: 0
seeds: [0, 1, 2, 3, 4]
common:
  stream.n_tasks: 200
  stream.samples_per_task: 5000
  stream.normalize: standard
  metrics.every_n_tasks: 5
  metrics.fisher_samples: 32
  metrics.update_tracking_every: 100
  fresh_reference.every_n_tasks: 25
runs:
  - {label: adam_std, overrides: {optimizer.name: adam, optimizer.lr: 0.001, method.name: baseline}}
  - {label: adam_sin, overrides: {optimizer.name: adam, optimizer.lr: 0.001, model.reparam.hidden: sin, model.reparam.output: sin, model.gamma: 1.5}}
  - {label: adam_tanh, overrides: {optimizer.name: adam, optimizer.lr: 0.001, model.reparam.hidden: tanh, model.reparam.output: tanh, model.gamma: 1.5}}
  - {label: adam_weight_clipping, overrides: {optimizer.name: adam, optimizer.lr: 0.001, method.name: weight_clipping, method.kappa: 1.0}}
  - {label: adam_tri, overrides: {optimizer.name: adam, optimizer.lr: 0.001, model.reparam.hidden: tri, model.reparam.output: tri, model.gamma: 1.0}}
  - {label: sgd_std, overrides: {optimizer.lr: 0.003, method.name: baseline}}
  - {label: sgd_weight_clipping, overrides: {optimizer.lr: 0.003, method.name: weight_clipping, method.kappa: 1.0}}
  - {label: sgd_tri, overrides: {optimizer.lr: 0.003, model.reparam.hidden: tri, model.reparam.output: tri, model.gamma: 1.0}}

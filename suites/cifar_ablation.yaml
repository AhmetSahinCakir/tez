# Component analysis on the FINAL CIFAR-100 binary streams (3 seeds, paired with cifar_main seeds 0-2).
name: cifar_ablation
base_config: configs/cifar_pilot.yaml
workers: 4
stream_seed_offset: 0
selected_hparams: suites/selected_cifar.yaml
seeds: [0, 1, 2]
common:
  stream.n_tasks: 1000
  metrics.every_n_tasks: 10
  metrics.fisher_samples: 32
  metrics.update_tracking_every: 100
  fresh_reference.every_n_tasks: 100
runs:
  - {label: sin/bias_std, overrides: {model.reparam.hidden: sin, model.reparam.output: sin, model.compact_bias: false}}
  - {label: sin/hidden_only, overrides: {model.reparam.hidden: sin, model.reparam.output: standard}}
  - {label: sin/output_only, overrides: {model.reparam.hidden: standard, model.reparam.output: sin}}
  - {label: sin/gamma, overrides: {model.reparam.hidden: sin, model.reparam.output: sin}, sweep: {model.gamma: [1.2, 2.5]}}
  - {label: sin/scale_corrected, overrides: {model.reparam.hidden: sin, model.reparam.output: sin, method.name: scale_corrected, method.max_scale: 10.0}}
  - {label: sin_act, overrides: {model.activation: sin, optimizer.lr: 0.003}}
  - {label: smooth_leaky, overrides: {model.activation: smooth_leaky, optimizer.lr: 0.003}}

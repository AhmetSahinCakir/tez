# Main comparison on the FINAL sequential CIFAR-100 binary streams (online variant, see docs/RAPOR.md §7).
name: cifar_main
base_config: configs/cifar_pilot.yaml
workers: 4
stream_seed_offset: 0
selected_hparams: suites/selected_cifar.yaml
seeds: [0, 1, 2, 3, 4]
common:
  stream.n_tasks: 1000
  metrics.every_n_tasks: 10
  metrics.fisher_samples: 32
  metrics.update_tracking_every: 100
  fresh_reference.every_n_tasks: 100
runs:
  - {label: baseline, overrides: {method.name: baseline}}
  - {label: sin, overrides: {model.reparam.hidden: sin, model.reparam.output: sin}}
  - {label: tanh, overrides: {model.reparam.hidden: tanh, model.reparam.output: tanh}}
  - {label: weight_clipping, overrides: {method.name: weight_clipping}}
  - {label: l2_init, overrides: {method.name: l2_init}}
  - {label: continual_backprop, overrides: {method.name: continual_backprop}}
  - {label: nap, overrides: {method.name: nap, model.layer_norm: true, model.ln_affine: false}}
  - {label: ln_wd, overrides: {method.name: ln_wd, model.layer_norm: true}}

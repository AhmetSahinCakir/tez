# Random Label MNIST (Kumar, Marklund and Van Roy, CoLLAs 2024, Section 4.2 and Table 1): 1,200 fixed MNIST
# images, new uniformly random labels in every task, 400 epochs per task, batch size 16, 50 tasks.
# Performance: average online task accuracy (key task_accuracy).  Deviation from the source: the network and
# the initialization are those of this project (three hidden layers of 100 units, Kaiming-uniform bound,
# zero biases) instead of two hidden layers with the PyTorch default initialization.
base: base.yaml
stream:
  name: random_label_mnist
  n_tasks: 50
  samples_per_task: 1200
  normalize: unit
model:
  hidden_sizes: [100, 100, 100]
optimizer: {name: sgd, lr: 0.01}
train: {batch_size: 16, epochs_per_task: 400}
metrics: {every_n_tasks: 1, probe_size: 1000, fisher_samples: 32, update_tracking_every: 100}
fresh_reference: {every_n_tasks: 10}
summary: {window: 0.2}
